name: CI

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Validate VERSION format
        run: |
          VERSION=$(cat VERSION)
          if ! [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version format in VERSION file. Use MAJOR.MINOR.PATCH (e.g. 0.8.0)"
            exit 1
          fi
      - name: Verify shell scripts use LF line endings
        run: |
          set -e
          for file in scripts/*.sh nginx/entrypoint.sh; do
            if grep -q $'\r' "$file"; then
              echo "CRLF line endings are not allowed in $file"
              exit 1
            fi
          done
      - name: Run Alembic migrations on fresh database
        run: alembic upgrade head
        env:
          SECRET_KEY: test-secret-key-for-ci-only-32-characters!!
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
      - name: Run tests
        run: python -m pytest -q
        env:
          SECRET_KEY: test-secret-key-for-ci-only-32-characters!!
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test

  build-image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Get version from file
        id: get-version
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT
      - name: Build and tag image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          tags: my-api:${{ steps.get-version.outputs.version }}
          push: false

#docker-compose.yaml
services:
  db:
    image: postgres:15
    restart: always
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
      backup:
        condition: service_started
    env_file: .env
    environment:
      ROOT_PATH: ${ROOT_PATH:-/archive}
      PUBLIC_HTTPS_PORT: ${HTTPS_PORT:-8443}
      BACKUP_AGENT_URL: http://backup:9002
      OPS_AGENT_URL: http://ops-agent:9001
      OCR_SERVICE_URL: http://ocr:9003
    volumes:
      - .:/app
      - ${UPLOAD_HOST_PATH:-./uploaded_files}:/app/uploaded_files
      - ${BACKUP_HOST_PATH:-./backups}:/app/backups:ro
    expose:
      - "8000"
    working_dir: /app
    command: ["sh", "/usr/local/bin/docker-entrypoint.sh", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  proxy:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - api
    ports:
      - "0.0.0.0:${HTTP_PORT:-80}:80"
      - "0.0.0.0:${HTTPS_PORT:-8443}:443"
    environment:
      SSL_CERT_CN: ${SSL_CERT_CN:-localhost}
      SSL_CERT_IP: ${SSL_CERT_IP:-}
      SSL_CERT_DAYS: ${SSL_CERT_DAYS:-825}
      PUBLIC_HTTPS_PORT: ${HTTPS_PORT:-8443}
      MAX_CLIENT_BODY_MB: ${MAX_CLIENT_BODY_MB:-12}
    volumes:
      - ./nginx/certs:/etc/nginx/certs

  backup:
    build: ./backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      BACKUP_DIR: /backups
      UPLOADS_DIR: /uploads
      POSTGRES_HOST: db
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 2 * * *}
    volumes:
      - ${BACKUP_HOST_PATH:-./backups}:/backups
      - ${UPLOAD_HOST_PATH:-./uploaded_files}:/uploads:ro
    expose:
      - "9002"

  ops-agent:
    build: ./ops-agent
    restart: unless-stopped
    environment:
      OPS_AGENT_TOKEN: ${OPS_AGENT_TOKEN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose:
      - "9001"

  # Optional sidecar: API starts without waiting for OCR health.
  # Not published to the host — browser uses proxy → api; api calls http://ocr:9003.
  ocr:
    build: ./ocr
    restart: unless-stopped
    env_file: .env
    environment:
      UPLOADS_DIR: /uploads
      OCR_SERVICE_TOKEN: ${OCR_SERVICE_TOKEN:-}
    volumes:
      - ${UPLOAD_HOST_PATH:-./uploaded_files}:/uploads
    expose:
      - "9003"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9003/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pgdata:

upstream archive_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    # Root landing — redirect to archive service
    location = / {
        return 302 /archive/documents;
    }

    # Global health (for deploy scripts / monitoring)
    location = /health {
        proxy_pass http://archive_api/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Archive document service
    location = /archive {
        return 302 /archive/;
    }

    location /archive/ {
        proxy_pass http://archive_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /archive;
    }

    # Future microservices — add new location blocks here, e.g.:
    # location /reports/ {
    #     proxy_pass http://reports_service:8001/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}

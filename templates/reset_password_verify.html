<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Код восстановления пароля</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; background: #f0f2f5; margin: 0; padding: 1rem; box-sizing: border-box; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; box-sizing: border-box; }
        input { width: 100%; padding: 0.5rem; margin-bottom: 1rem; box-sizing: border-box; }
        button { width: 100%; padding: 0.7rem; border: none; border-radius: 4px; background: #007bff; color: white; cursor: pointer; }
        button.secondary { background: #6c757d; }
        .actions { display: flex; flex-direction: column; gap: 0.75rem; margin-top: 0.5rem; }
        .alert { padding: 0.75rem; margin-bottom: 1rem; border-radius: 4px; background: #f8d7da; color: #721c24; }
        .alert-success { background: #d4edda; color: #155724; }
        .hint { color: #6c757d; font-size: 0.875rem; }
        .link { text-align: center; margin-top: 1rem; }
        .link a { color: #007bff; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <form method="post" action="{{ url_path('/reset-password/verify') }}">
            <h2>Восстановление пароля</h2>
            {% if error %}<div class="alert">{{ error_message or 'Ошибка подтверждения.' }}</div>{% endif %}
            {% if sent %}<div class="alert alert-success">Код отправлен на {{ email }}.</div>{% endif %}
            <p class="hint">Введите 6-значный код из письма для логина <strong>{{ login }}</strong>.</p>
            <input type="hidden" name="login" value="{{ login }}">
            <label for="code">Код:</label>
            <input type="text" id="code" name="code" required pattern="[0-9]{6}" maxlength="6" inputmode="numeric">
            <div class="actions">
                <button type="submit">Подтвердить</button>
            </div>
        </form>
        <form method="post" action="{{ url_path('/reset-password/resend') }}">
            <input type="hidden" name="login" value="{{ login }}">
            <div class="actions">
                <button type="submit" class="secondary">Отправить код повторно</button>
            </div>
        </form>
        <div class="link"><a href="{{ url_path('/login') }}">Назад ко входу</a></div>
    </div>
</body>
</html>

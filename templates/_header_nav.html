<nav>
    {% if user %}
        {% if user.role.value == 'master_admin' %}
        <a href="{{ url_path('/admin') }}">Администрирование</a>
        {% endif %}
        <a href="{{ url_path('/profile') }}">Личный кабинет</a>
        <a href="{{ url_path('/notifications') }}" id="notifications-link">
            Уведомления{% if unread_count %} ({{ unread_count }}){% endif %}
        </a>
        <a href="{{ url_path('/projects') }}">Проекты</a>
    {% else %}
        <a href="{{ url_path('/login') }}">Вход</a>
        <a href="{{ url_path('/register') }}">Регистрация</a>
    {% endif %}
    <a href="{{ url_path('/help') }}" target="_blank" rel="noopener noreferrer">Помощь</a>
    {% if user %}
    <a href="{{ url_path('/logout') }}">Выйти ({{ user.full_name or user.login }})</a>
    {% endif %}
</nav>

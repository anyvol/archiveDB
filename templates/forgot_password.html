<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Восстановление пароля</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5" style="max-width:480px;">
    <h2>Забыли пароль?</h2>
    {% if sent %}
    <div class="alert alert-success">Если аккаунт с указанным логином или email существует, письмо отправлено.</div>
    {% endif %}
    {% if error %}
    <div class="alert alert-danger">Почтовый сервер не настроен. Обратитесь к администратору.</div>
    {% endif %}
    <form method="post" action="{{ url_path('/forgot-password') }}">
        <div class="mb-3">
            <label class="form-label">Логин или email</label>
            <input type="text" class="form-control" name="login_or_email" required>
        </div>
        <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary">Отправить код</button>
            <a href="{{ url_path('/login') }}" class="btn btn-link">Назад ко входу</a>
        </div>
    </form>
</div>
</body>
</html>

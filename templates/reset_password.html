<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Новый пароль</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5" style="max-width:480px;">
    <h2>Новый пароль</h2>
    {% if error %}
    <div class="alert alert-danger">{{ error_message or 'Ошибка.' }}</div>
    {% endif %}
    <form method="post" action="{{ url_path('/reset-password') }}">
        <input type="hidden" name="token" value="{{ token }}">
        <div class="mb-3">
            <label class="form-label">Новый пароль (мин. 8 символов)</label>
            <input type="password" class="form-control" name="password" required minlength="8">
        </div>
        <div class="mb-3">
            <label class="form-label">Подтверждение</label>
            <input type="password" class="form-control" name="password_confirm" required minlength="8">
        </div>
        <button type="submit" class="btn btn-primary">Сохранить пароль</button>
    </form>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Код доступа</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f0f2f5; margin: 0; }
        form { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 420px; }
        input { width: 100%; padding: 0.5rem; margin-bottom: 1rem; box-sizing: border-box; }
        button { width: 100%; padding: 0.7rem; border: none; border-radius: 4px; background: #007bff; color: white; cursor: pointer; }
        .alert { padding: 0.75rem; margin-bottom: 1rem; border-radius: 4px; background: #f8d7da; color: #721c24; }
        .hint { color: #6c757d; font-size: 0.875rem; line-height: 1.45; }
        .logout { display: block; text-align: center; margin-top: 1rem; color: #6c757d; }
    </style>
</head>
<body>
    <form method="post" action="{{ url_path('/access-code') }}">
        <h2>Код доступа администратора</h2>
        {% if error %}<div class="alert">{{ error_message or 'Неверный или просроченный код.' }}</div>{% endif %}
        <p class="hint">
            Email подтверждён. Для первого входа в систему получите одноразовый код у администратора
            и введите его ниже. Код действует 15 минут после выпуска.
        </p>
        <label for="code">Код:</label>
        <input type="text" id="code" name="code" required pattern="[0-9]{6}" maxlength="6" inputmode="numeric" autofocus>
        <button type="submit">Подтвердить доступ</button>
        <a class="logout" href="{{ url_path('/logout') }}">Выйти</a>
    </form>
</body>
</html>

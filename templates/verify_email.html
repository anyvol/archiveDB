<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Подтверждение email</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f0f2f5; margin: 0; }
        form { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 400px; }
        input { width: 100%; padding: 0.5rem; margin-bottom: 1rem; box-sizing: border-box; }
        button { width: 100%; padding: 0.7rem; border: none; border-radius: 4px; background: #007bff; color: white; cursor: pointer; }
        .alert { padding: 0.75rem; margin-bottom: 1rem; border-radius: 4px; background: #f8d7da; color: #721c24; }
        .hint { color: #6c757d; font-size: 0.875rem; }
    </style>
</head>
<body>
    <form method="post" action="{{ url_path('/verify-email') }}">
        <h2>Подтверждение email</h2>
        {% if error %}<div class="alert">{{ error_message or 'Ошибка подтверждения.' }}</div>{% endif %}
        {% if sent %}<div class="hint" style="margin-bottom:1rem;">Код отправлен на {{ email }}.</div>{% endif %}
        <p class="hint">Введите 6-значный код из письма для логина <strong>{{ login }}</strong>.</p>
        <input type="hidden" name="login" value="{{ login }}">
        <label for="code">Код:</label>
        <input type="text" id="code" name="code" required pattern="[0-9]{6}" maxlength="6" inputmode="numeric">
        <button type="submit">Подтвердить</button>
        <p class="hint" style="margin-top:1rem;"><a href="{{ url_path('/login') }}">Перейти ко входу</a></p>
    </form>
    <form method="post" action="{{ url_path('/verify-email/resend') }}" style="margin-top:1rem;">
        <input type="hidden" name="login" value="{{ login }}">
        <button type="submit" style="background:#6c757d;">Отправить код повторно</button>
    </form>
</body>
</html>
